{% extends 'base.html' %}

{% block title %}Réinitialiser le mot de passe - Venus Luna{% endblock %}

{% block content %}
<section class="container py-5" style="max-width: 640px;">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-3">Mot de passe oublié</h1>
      <p class="text-muted mb-4">
        Saisissez votre adresse email. Si un compte existe, vous recevrez un lien de réinitialisation.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100" type="submit">Envoyer le lien</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
